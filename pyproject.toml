[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wenlint"
version = "0.1.0"
description = "文尺 WenLint：中文写作静态检查器——像 ESLint 一样检查 PRD、论文、报告和 Markdown"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zheng Haipei" }]
requires-python = ">=3.9"
keywords = ["linter", "chinese", "prose", "writing", "markdown"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
wenlint = "wenlint.cli:main"

[tool.setuptools]
packages = ["wenlint"]
